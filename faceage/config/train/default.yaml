# eval.py 스크립트가 필요로 하는 최소한의 설정
model:
  in_channels: 3  # RGB 이미지의 경우 3
  dropout: 0.0 # 평가 시에는 사용되지 않더라도 구조를 위해 필요할 수 있음

data:
  num_bins: 100            # SoftHead가 나이를 나눈 '빈(bin)'의 개수입니다. 
                           # 학습 시 설정과 정확히 일치해야 합니다. (예: 100개, 117개 등)
  use_race_onehot: True    # race 정보를 사용하는지 여부입니다. (코드가 race를 전달하므로 True일 가능성이 높습니다.)

train:
  checkpoint_dir: '/content/drive/MyDrive/MLProject/checkpoints' # 체크포인트 파일이 있는 디렉토리 경로

# expected_age_from_logits 함수가 SoftHead의 로짓을 나이로 변환할 때 필요합니다.
# 이 정보가 없다면 함수가 디폴트 값(예: 0~100)을 사용하게 됩니다.
metrics:
  age_range: [0, 100] # 나이 예측 범위 (예: 0세부터 100세)
  # 또는
  target_mean: 45.5
  target_std_dev: 15.2